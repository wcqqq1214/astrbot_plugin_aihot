[project]
name = "astrbot-plugin-aihot"
version = "1.0.2"
description = "AI HOT AstrBot plugin: aggregates AI industry news, hot topics and daily reports"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
# The plugin's own runtime dependencies. AstrBot (and its framework
# dependencies) is provided by the AstrBot process the plugin runs in.
dependencies = [
    "httpx>=0.27,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.9,<1",
]
