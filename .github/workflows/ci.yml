name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync locked environment
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Check lockfile
        run: uv lock --check
      - name: Run behavior tests
        run: uv run python -m unittest tests.test_client tests.test_formatter tests.test_release_guard tests.test_workflow_config -v
      - name: Check synchronized versions
        run: |
          set -euo pipefail
          metadata_version="$(sed -n 's/^version:[[:space:]]*\([^ #]*\).*/\1/p' metadata.yaml | head -n 1)"
          project_version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' pyproject.toml | head -n 1)"
          lock_version="$(awk '$0 == "name = \"astrbot-plugin-aihot\"" { found=1; next } found && /^version = / { gsub(/[\"]/, "", $3); print $3; exit } found && /^\[\[package\]\]/ { exit }' uv.lock)"
          test "$metadata_version" = "$project_version"
          test "$metadata_version" = "$lock_version"
          printf '%s\n' "$metadata_version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

  astrbot-integration:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/..:${{ github.workspace }}/AstrBot
    steps:
      - name: Checkout plugin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout AstrBot host at v4.26.8
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: AstrBotDevs/AstrBot
          ref: v4.26.8
          path: AstrBot
          persist-credentials: false
      - name: Install host and plugin dependencies
        run: |
          set -euo pipefail
          python -m venv .astrbot-venv
          .astrbot-venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .astrbot-venv/bin/pip install --disable-pip-version-check -e ./AstrBot
          .astrbot-venv/bin/pip install --disable-pip-version-check -r requirements.txt
      - name: Run AstrBot integration tests
        run: |
          set -euo pipefail
          output="$(.astrbot-venv/bin/python -m unittest tests.test_plugin_behavior -v 2>&1)" || {
            printf '%s\n' "$output"
            exit 1
          }
          printf '%s\n' "$output"
          if printf '%s\n' "$output" | grep -q 'skipped'; then
            echo "AstrBot integration tests must not be skipped"
            exit 1
          fi
