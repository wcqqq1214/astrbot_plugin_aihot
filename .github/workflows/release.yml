name: auto-release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "metadata.yaml"

jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version_changed: ${{ steps.check.outputs.changed }}
      new_version: ${{ steps.check.outputs.version }}
      old_version: ${{ steps.check.outputs.old_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check strict SemVer and synchronized metadata
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python .github/scripts/release_guard.py version \
            --event-name "$EVENT_NAME" \
            --event-ref "$EVENT_REF" \
            --event-before "$EVENT_BEFORE" \
            --metadata metadata.yaml \
            --pyproject pyproject.toml \
            --lock uv.lock >> "$GITHUB_OUTPUT"

  create-release:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NEW_VERSION: ${{ needs.check-version.outputs.new_version }}
      OLD_VERSION: ${{ needs.check-version.outputs.old_version }}
      REPOSITORY: ${{ github.repository }}
      COMMIT_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fail closed for existing tag or release
        run: |
          set -euo pipefail
          python .github/scripts/release_guard.py remote \
            --repository "$REPOSITORY" \
            --version "$NEW_VERSION"

      - name: Package plugin
        run: |
          set -euo pipefail
          mkdir -p dist
          git ls-files ':!.github/**' ':!tests/**' | zip -@ "dist/astrbot_plugin_aihot-${NEW_VERSION}.zip"

      - name: Generate release notes
        run: |
          set -euo pipefail
          {
            echo "## AI HOT ${NEW_VERSION}"
            echo
            if [[ "$OLD_VERSION" != "none" ]] && git rev-parse "$OLD_VERSION" >/dev/null 2>&1; then
              git log --pretty=format:'- %s ([%h](https://github.com/'"$REPOSITORY"'/commit/%H))' "$OLD_VERSION..$COMMIT_SHA" --no-merges
              echo
              echo
              echo "**Full Changelog**: https://github.com/${REPOSITORY}/compare/${OLD_VERSION}...${NEW_VERSION}"
            else
              echo "Initial release"
            fi
          } > release_notes.md

      - name: Create immutable release
        run: |
          set -euo pipefail
          gh release create "$NEW_VERSION" \
            "dist/astrbot_plugin_aihot-${NEW_VERSION}.zip" \
            --target "$COMMIT_SHA" \
            --title "AI HOT ${NEW_VERSION}" \
            --notes-file release_notes.md
