name: astrbot_plugin_aihot # 插件唯一识别名，以 astrbot_plugin_ 前缀开头
display_name: AI HOT # 用于展示的名字，方便人类阅读（需要版本 >= v4.5.0）
short_desc: 聚合 AI HOT 的 AI 行业动态、热点榜与日报，支持搜索 # 紧凑 UI 使用的短描述（Optional）
desc: |
  聚合 AI HOT（aihot.virxact.com）的 AI 行业动态、热点榜与日报。提供精选或 7 天公开池动态的分类过滤与关键词搜索、当前热点 TOP 10、按天获取的 AI 日报，以及热点事件时间线与 AI 综述。数据通过 AI HOT 的匿名只读 REST API v1 获取，无需 API Key。
version: 1.0.0 # 插件版本号。格式：1.1.1 或者 1.1
author: wcqqq1214 # 作者
repo: https://github.com/wcqqq1214/astrbot_plugin_aihot # 插件的仓库地址
tags: # 标签列表，用于插件市场分类和搜索（Optional）
  - ai
  - news
  - 日报
  - 聚合
support_platforms: # 声明支持的平台适配器（Optional）
  - qq_official
astrbot_version: ">=4.26.7,<5" # 声明要求的 AstrBot 版本范围（Optional）
